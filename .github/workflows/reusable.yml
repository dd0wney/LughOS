# Reusable LughOS CI Workflow
#
# This is the single copy of the LughOS CI logic. .github/workflows/ci.yml
# calls it for this repository, and other projects can call it too.
#
# It replaced build.yml, matrix_build.yml and analysis.yml, each of which
# held a near-identical copy of these jobs. Three copies meant a repair
# landed in some and not others: this file sat unrepaired for months with a
# dead xsltproc step, a toolchain that lost cc1 in transit, and three
# `|| true` masks, because nothing called it so nothing caught the drift.
# One copy, exercised on every pull request, cannot rot the same way.

name: LughOS Reusable CI
on:
  workflow_call:
    inputs:
      architectures:
        required: false
        type: string
        default: '["x86", "arm", "riscv"]'
        description: 'JSON array of architectures to build'
      run-tests:
        required: false
        type: boolean
        default: true
        description: 'Whether to run tests'
      run-analysis:
        required: false
        type: boolean
        default: true
        description: 'Whether to run static analysis'

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ inputs.architectures }}
    steps:
      - uses: actions/checkout@v4

      # The toolchain and NNG travel by cache, never by artifact.
      # actions/upload-artifact does not preserve the executable bit and did
      # not reconstruct the libexec tree that holds cc1, so every x86 build
      # downstream failed with:
      #     i686-elf-gcc: error trying to exec 'cc1': No such file or dir
      # The build job restores these same keys.
      - name: Cache i686-elf toolchain
        id: cache-i686-elf-toolchain
        uses: actions/cache@v4
        with:
          path: i686-elf-tools-linux
          key: ${{ runner.os }}-i686-elf-tools-linux-7.1.0

      - name: Cache NNG build
        id: cache-nng-build
        uses: actions/cache@v4
        with:
          path: nng/build
          key: ${{ runner.os }}-nng-build-v1

      - name: Install i686-elf-gcc
        if: steps.cache-i686-elf-toolchain.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
          mkdir -p i686-elf-tools-linux
          unzip i686-elf-tools-linux.zip -d i686-elf-tools-linux
          chmod +x i686-elf-tools-linux/bin/*

      - name: Build and install NNG
        if: steps.cache-nng-build.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nanomsg/nng.git
          cd nng
          mkdir build && cd build
          cmake -G "Unix Makefiles" ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      # Compile something. `which i686-elf-gcc` succeeded on every broken
      # run, because the driver was present and only its cc1 backend was
      # missing. A real compile is the smallest check that tells those
      # apart, and running it here fails before the matrix starts.
      - name: Verify the toolchain can compile
        run: |
          echo 'int main(void){return 0;}' > /tmp/probe.c
          ./i686-elf-tools-linux/bin/i686-elf-gcc \
            -ffreestanding -nostdlib -c /tmp/probe.c -o /tmp/probe.o
          echo "i686-elf toolchain is functional"

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.setup.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install common dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ binutils nasm gcc-arm-none-eabi binutils-arm-none-eabi
          sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
          sudo apt-get install -y cmake make git qemu-system-i386 qemu-system-arm qemu-system-riscv64 unzip

      - name: Cache i686-elf toolchain
        id: cache-i686-elf-toolchain
        uses: actions/cache@v4
        with:
          path: i686-elf-tools-linux
          key: ${{ runner.os }}-i686-elf-tools-linux-7.1.0

      - name: Install i686-elf-gcc
        if: steps.cache-i686-elf-toolchain.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
          mkdir -p i686-elf-tools-linux
          unzip i686-elf-tools-linux.zip -d i686-elf-tools-linux
          chmod +x i686-elf-tools-linux/bin/*

      - name: Cache NNG build
        uses: actions/cache@v4
        with:
          path: nng/build
          key: ${{ runner.os }}-nng-build-v1

      - name: Add i686-elf toolchain to PATH
        run: echo "${{ github.workspace }}/i686-elf-tools-linux/bin" >> $GITHUB_PATH

      # ARCH goes through the environment rather than into the script text.
      # inputs.architectures comes from the caller, so a downstream project
      # controls the matrix values; interpolating them straight into a
      # `run:` block would let a caller inject shell. The allowlist check
      # is the second layer.
      - name: Build
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          case "$ARCH" in
            x86|arm|riscv) ;;
            *) echo "::error::unsupported architecture '$ARCH'"; exit 1 ;;
          esac
          if [ "$ARCH" = "x86" ]; then
            i686-elf-gcc --version > /dev/null
          fi
          make "$ARCH"

      # run_tests.sh returns a meaningful status, so it is not wrapped in
      # `|| true` here. Discarding it would waste the only end-to-end gate
      # this workflow has.
      - name: Run QEMU tests
        if: inputs.run-tests && matrix.architecture == 'x86'
        run: |
          chmod +x ./scripts/run_tests.sh
          ./scripts/run_tests.sh

      # `with:` values are not shell, so interpolating the matrix value
      # here carries no injection risk. Only `run:` blocks need the env
      # indirection.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lughos-${{ matrix.architecture }}-build
          path: build/${{ matrix.architecture }}

      - name: Upload test logs
        if: always() && matrix.architecture == 'x86'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-x86
          path: test-logs/
          if-no-files-found: ignore

  analysis:
    if: inputs.run-analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy

      # clang-tidy stays advisory. Without a compilation database on
      # freestanding kernel sources it is too noisy to gate on, and its
      # exported fixes are uploaded for a human to read.
      - name: Run static analysis with clang-tidy (CERT C)
        run: |
          mkdir -p reports
          clang-tidy "-checks=cert-*,clang-analyzer-security.*,clang-analyzer-core.*" \
            kernel/*.c kernel/*/*.c kernel/*/*/*.c services/*/*.c \
            -export-fixes=reports/clang-tidy-fixes.yaml \
            -- -Iinclude || true

      # services/*/*.c, not a hand-listed set. The old list named scheduler,
      # storage and update only, so services/auditor and services/workflow
      # were never analysed.
      - name: Run static analysis with Cppcheck
        run: |
          mkdir -p reports
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --xml --xml-version=2 \
            -Iinclude \
            kernel/*.c kernel/*/*.c kernel/*/*/*.c \
            services/*/*.c \
            2> reports/cppcheck-report.xml

      # Replaces an xsltproc call against
      # /usr/share/cppcheck/cppcheck-htmlreport.xslt, which has not shipped
      # with cppcheck for years. That step failed on every run and took the
      # job with it, so the job could only fail cosmetically and never for a
      # finding. --fail-on error makes the result mean something.
      - name: Generate report and gate on error-severity findings
        run: |
          python3 scripts/cppcheck_report.py reports/cppcheck-report.xml \
            --html reports/cppcheck-report.html \
            --title "LughOS Cppcheck Report" \
            --fail-on error

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: reports/

  test:
    if: inputs.run-tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-i386 qemu-system-arm qemu-system-riscv64

      # Every step below iterates the architectures the caller asked for,
      # read from the environment rather than interpolated into the script.
      # A requested architecture with no artifact is a failure: the previous
      # version hid it behind `cp ... || true` and then wrote a cross into a
      # markdown file that nothing acted on.
      - name: Collect build artifacts
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          missing=0
          for arch in $(printf '%s' "$ARCHITECTURES" | jq -r '.[]'); do
            case "$arch" in
              x86|arm|riscv) ;;
              *) echo "::error::unsupported architecture '$arch'"; exit 1 ;;
            esac
            mkdir -p "build/${arch}"
            if [ -d "artifacts/lughos-${arch}-build" ]; then
              cp -R "artifacts/lughos-${arch}-build/." "build/${arch}/"
            else
              echo "::error::no build artifact for ${arch}"
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "${missing} architecture(s) produced no build artifact"
            exit 1
          fi

      - name: Run unit tests
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          mkdir -p test-logs
          chmod +x ./scripts/run_unit_tests.sh
          failed=0
          {
            echo "# LughOS Test Results"
            echo ""
            echo "| Architecture | Kernel | Unit tests |"
            echo "|---|---|---|"
          } > test-logs/test-summary.md

          for arch in $(printf '%s' "$ARCHITECTURES" | jq -r '.[]'); do
            if [ ! -f "build/${arch}/lughos.bin" ]; then
              echo "| ${arch} | ❌ missing | skipped |" >> test-logs/test-summary.md
              failed=$((failed + 1))
              continue
            fi
            # run_unit_tests.sh exits non-zero on a real failure. The old
            # `|| true` here threw that away.
            if ./scripts/run_unit_tests.sh "${arch}"; then
              echo "| ${arch} | ✅ | ✅ |" >> test-logs/test-summary.md
            else
              echo "| ${arch} | ✅ | ❌ |" >> test-logs/test-summary.md
              failed=$((failed + 1))
            fi
          done

          cat test-logs/test-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat test-logs/test-summary.md

          if [ "${failed}" -ne 0 ]; then
            echo "::error::${failed} architecture(s) failed"
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-logs/
