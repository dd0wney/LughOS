name: LughOS Static Analysis
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy

      - name: Run static analysis with clang-tidy (CERT C)
        run: |
          mkdir -p reports
          clang-tidy "-checks=cert-*,clang-analyzer-security.*,clang-analyzer-core.*" \
            kernel/*.c kernel/*/*.c kernel/*/*/*.c services/*/*.c \
            -export-fixes=reports/clang-tidy-fixes.yaml \
            -- -Iinclude || true
          echo "See clang-tidy-fixes.yaml for issues found"

      # services/auditor and services/workflow were missing from this list,
      # so the telemetry exporter and the workflow engine were never
      # analysed. Use services/*/*.c so a new service directory is covered
      # the day it is added, rather than the day someone remembers.
      - name: Run static analysis with Cppcheck
        run: |
          mkdir -p reports
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --xml --xml-version=2 \
            -Iinclude \
            kernel/*.c kernel/*/*.c kernel/*/*/*.c \
            services/*/*.c \
            2> reports/cppcheck-report.xml
          echo "Cppcheck analysis completed, see reports/cppcheck-report.xml"

      # Replaces an xsltproc call against
      # /usr/share/cppcheck/cppcheck-htmlreport.xslt. That file has not
      # shipped with cppcheck for years, so the step failed on every run
      # with "failed to load external entity" and took the whole job with
      # it. The job could therefore only fail for a cosmetic reason and
      # never for an actual finding.
      #
      # --fail-on error makes the job mean something: an error-severity
      # finding now fails CI. There are none today. Style and warning
      # findings are reported but do not gate, because the tree carries
      # roughly a hundred of them and gating on those would be a separate
      # piece of work.
      - name: Generate report and gate on error-severity findings
        run: |
          python3 scripts/cppcheck_report.py reports/cppcheck-report.xml \
            --html reports/cppcheck-report.html \
            --title "LughOS Cppcheck Report" \
            --fail-on error

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: reports/
