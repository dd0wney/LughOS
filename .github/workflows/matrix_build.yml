name: LughOS Matrix Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit-toolchain: ${{ steps.cache-i686-elf-toolchain.outputs.cache-hit }}
      cache-hit-nng: ${{ steps.cache-nng-build.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache i686-elf toolchain
        id: cache-i686-elf-toolchain
        uses: actions/cache@v4
        with:
          path: i686-elf-tools-linux
          key: ${{ runner.os }}-i686-elf-tools-linux-7.1.0

      - name: Cache NNG build
        id: cache-nng-build
        uses: actions/cache@v4
        with:
          path: nng/build
          key: ${{ runner.os }}-nng-build-v1

      - name: Install i686-elf-gcc
        if: steps.cache-i686-elf-toolchain.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
          mkdir -p i686-elf-tools-linux
          unzip i686-elf-tools-linux.zip -d i686-elf-tools-linux
          chmod +x i686-elf-tools-linux/bin/*
          
      - name: Build and install NNG
        if: steps.cache-nng-build.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nanomsg/nng.git
          cd nng
          mkdir build && cd build
          cmake -G "Unix Makefiles" ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      # No artifact upload. This job exists to populate the two caches that
      # the build matrix restores from, and `needs: setup` is what orders
      # them. The toolchain used to be uploaded as an artifact and
      # downloaded per architecture, which lost the executable bit and the
      # libexec tree that holds cc1.

      - name: Verify the cached toolchain can compile
        run: |
          echo 'int main(void){return 0;}' > /tmp/probe.c
          ./i686-elf-tools-linux/bin/i686-elf-gcc \
            -ffreestanding -nostdlib -c /tmp/probe.c -o /tmp/probe.o
          echo "i686-elf toolchain is functional before the matrix starts"

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, arm, riscv]
    steps:
      - uses: actions/checkout@v4

      - name: Install common dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ binutils nasm gcc-arm-none-eabi binutils-arm-none-eabi
          sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
          sudo apt-get install -y cmake make git qemu-system-i386 qemu-system-arm qemu-system-riscv64 unzip
          
          # Verify toolchains are available
          echo "Checking toolchain availability:"
          which arm-none-eabi-gcc || echo "arm-none-eabi-gcc not found" 
          which riscv64-linux-gnu-gcc || echo "riscv64-linux-gnu-gcc not found"

      # The toolchain travels by cache, not by artifact.
      #
      # actions/upload-artifact does not preserve the executable bit, and
      # the round trip did not reconstruct the toolchain's libexec tree, so
      # every x86 build failed with:
      #     i686-elf-gcc: error trying to exec 'cc1': No such file or file
      # The `chmod +x bin/*` below only ever covered bin/, never
      # libexec/gcc/i686-elf/*/cc1 where the real compiler lives.
      #
      # actions/cache preserves permissions and the full tree, and this is
      # what build.yml already does successfully. `needs: setup` guarantees
      # the cache is populated before this job runs; the install step is the
      # fallback for a cache miss.
      - name: Cache i686-elf toolchain
        id: cache-i686-elf-toolchain
        uses: actions/cache@v4
        with:
          path: i686-elf-tools-linux
          key: ${{ runner.os }}-i686-elf-tools-linux-7.1.0

      - name: Install i686-elf-gcc
        if: steps.cache-i686-elf-toolchain.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
          mkdir -p i686-elf-tools-linux
          unzip i686-elf-tools-linux.zip -d i686-elf-tools-linux
          chmod +x i686-elf-tools-linux/bin/*

      - name: Cache NNG build
        id: cache-nng-build
        uses: actions/cache@v4
        with:
          path: nng/build
          key: ${{ runner.os }}-nng-build-v1

      - name: Add i686-elf toolchain to PATH
        run: echo "${{ github.workspace }}/i686-elf-tools-linux/bin" >> $GITHUB_PATH

      # Compile something rather than only checking that a file exists.
      # `which i686-elf-gcc` succeeded on every broken run, because the
      # driver was present and only its cc1 backend was missing. A real
      # compile is the smallest check that can tell those two apart.
      - name: Verify the i686-elf toolchain can compile
        if: matrix.architecture == 'x86'
        run: |
          echo 'int main(void){return 0;}' > /tmp/probe.c
          i686-elf-gcc -ffreestanding -nostdlib -c /tmp/probe.c -o /tmp/probe.o
          echo "i686-elf toolchain is functional"

      - name: Build for ${{ matrix.architecture }}
        run: make ${{ matrix.architecture }}

      # `|| true` used to discard the result. run_tests.sh now returns a
      # meaningful status, so throwing it away would waste the only test
      # gate this workflow has.
      - name: Run tests for ${{ matrix.architecture }}
        if: matrix.architecture == 'x86'
        run: |
          chmod +x ./scripts/run_tests.sh
          ./scripts/run_tests.sh

      - name: Upload test logs
        if: always() && matrix.architecture == 'x86'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-x86
          path: test-logs/
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lughos-${{ matrix.architecture }}-build
          path: |
            build/${{ matrix.architecture }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-i386 qemu-system-arm

      # This step used to write a tick or a cross into a markdown file and
      # then exit 0 either way, so a missing architecture was recorded and
      # never acted on. It now fails when an expected build is absent, and
      # the summary goes to the job summary where it is actually read.
      - name: Verify every architecture produced a build
        run: |
          mkdir -p test-reports
          missing=0
          {
            echo "# LughOS Build Results"
            echo ""
            echo "| Architecture | Build |"
            echo "|---|---|"
          } > test-reports/test-summary.md

          for arch in x86 arm riscv; do
            if [ -d "artifacts/lughos-${arch}-build" ]; then
              echo "| ${arch} | ✅ |" >> test-reports/test-summary.md
            else
              echo "| ${arch} | ❌ missing |" >> test-reports/test-summary.md
              missing=$((missing + 1))
            fi
          done

          cat test-reports/test-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat test-reports/test-summary.md

          if [ "${missing}" -ne 0 ]; then
            echo "::error::${missing} architecture(s) produced no build artifact"
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-reports
